name: Verify V2.6 real-photo editorial composition (no deployment)
on:
  push:
    branches: [feat/photo-editorial-v26-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Regression tests
        run: bun run test
      - name: Cloudflare Worker production build
        run: bun run build:cloudflare
      - name: Cloudflare Wrangler dry-run
        run: bunx wrangler deploy --dry-run
      - name: Start Worker preview
        run: |
          bunx vite preview --config vite.cloudflare.config.ts --host 127.0.0.1 --port 4173 > /tmp/worker-preview.log 2>&1 &
          echo $! > /tmp/worker-preview.pid
      - name: Validate SSR routes and local assets
        run: node scripts/verify-worker-pages.mjs
      - name: "Browser smoke: real imagery, layout proportions, static topics and AI"
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core
          node scripts/verify-browser-navigation.mjs
          node scripts/verify-topic-experience.mjs
          node scripts/verify-ui-polish-v22.mjs
      - name: Preview diagnostics on failure
        if: failure()
        run: cat /tmp/worker-preview.log || true
