name: V2.8 market workbench verification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run test:pages-bridge
      - run: bun run build:pages-bridge
      - run: bunx wrangler deploy --dry-run
      - name: Preview Worker
        run: bunx vite preview --config vite.cloudflare.config.ts --host 127.0.0.1 --port 4173 > /tmp/worker-preview.log 2>&1 &
      - run: node scripts/verify-worker-pages.mjs
      - name: Browser navigation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core
          node scripts/verify-browser-navigation.mjs
      - if: failure()
        run: cat /tmp/worker-preview.log || true
