name: Verify Cloudflare Workers adaptation

on:
  push:
    branches:
      - feat/cloudflare-workers-deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve dependencies and sync lockfile
        run: bun install
      - name: Commit updated bun.lock (branch only)
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: sync bun lockfile for Cloudflare build"
            git push
          fi
      - name: Build Workers bundle
        run: bun run build:cloudflare
      - name: Validate deploy bundle without publishing
        run: bunx wrangler deploy --dry-run
