name: Verify V2 AI decision quality (no automatic deployment)
on:
  push:
    branches:
      - feat/v2-ai-decision-quality-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Run all tests
        run: bun run test
      - name: Verify Cloudflare Worker production build
        run: bun run build:cloudflare
      - name: Validate Wrangler deployment bundle
        run: bunx wrangler deploy --dry-run
      - name: Start Worker local preview
        run: |
          bunx vite preview --config vite.cloudflare.config.ts --host 127.0.0.1 --port 4173 > /tmp/worker-preview.log 2>&1 &
          echo $! > /tmp/worker-preview.pid
      - name: Verify real SSR routes
        run: node scripts/verify-worker-pages.mjs
      - name: Print preview logs on failure
        if: failure()
        run: cat /tmp/worker-preview.log || true
