name: Verify editorial polish V2.2 (no deployment)
on:
  push:
    branches:
      - feat/ui-polish-v22-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Run unit and regression tests
        run: bun run test
      - name: Build Cloudflare Worker
        run: bun run build:cloudflare
      - name: Validate bundle without deploying
        run: bunx wrangler deploy --dry-run
      - name: Start local Worker preview
        run: |
          bunx vite preview --config vite.cloudflare.config.ts --host 127.0.0.1 --port 4173 > /tmp/worker-preview.log 2>&1 &
          echo $! > /tmp/worker-preview.pid
      - name: Check SSR routes and static assets
        run: node scripts/verify-worker-pages.mjs
      - name: Browser interaction and visual structure checks
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core
          node scripts/verify-browser-navigation.mjs
          node scripts/verify-topic-experience.mjs
          node scripts/verify-ui-polish-v22.mjs
      - name: Preview error logs
        if: failure()
        run: cat /tmp/worker-preview.log || true
